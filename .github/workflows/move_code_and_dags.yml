name: move_code_and_dags
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    

jobs:
  upload_to_dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{secrets.GCP_SA_KEY}}
      

      - name: Install SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{secrets.GCP_PROJECT_ID}}
      
      - name: Move Spark Code to GCS Bucket
        run: |
          gsutil cp spark-job/transformation.py gs://airflow-project-flights/spark_jobs/
      
      - name: Copy variables to GCS Bucket
        run: |
          gsutil cp variables/dev/variables.json gs://airflow-project-flights/data/dev/variables.json
      
      - name: Import variables in Airflow dev environment
        run: |
            gcloud composer environments run airflow-dev \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/dev/variables.json
      
      - name: Import DAGs to the dev Airflow environment
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-dev \
            --location us-central1 \
            --source airflow-job/airflow_job.py